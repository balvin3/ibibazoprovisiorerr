<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibisubizo by'Ikizamini | Provisoire Rwanda</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fc; color: #2d3748; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h2 { color: #0066ff; margin-bottom: 20px; border-left: 4px solid #0066ff; padding-left: 12px; }
        .review-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #f8fafc; }
        .review-img { max-width: 200px; display: block; margin: 10px 0; border-radius: 8px; }
        ul { list-style-type: none; padding-left: 0; margin: 10px 0; }
        li { padding: 4px 0; color: #4a5568; }
        .correct-ans { color: green; font-weight: bold; margin-top: 10px; display: inline-block; }
        .back-btn { display: inline-block; margin-top: 25px; padding: 12px 24px; background: #0066ff; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .back-btn:hover { background: #0052cc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ibisubizo by'ikizamini</h2>

    <div id="review-container">
        <!-- Ahazanywa ibisubizo na JavaScript -->
        <p>Turi gushaka amakuru y'ibisubizo...</p>
    </div>

    <a href="index.html" class="back-btn">Subira ahabanza</a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById("review-container");
        let reviewData = JSON.parse(localStorage.getItem("provisoire_last_review")) || [];

        if (reviewData.length === 0) {
            container.innerHTML = "<p>Nta bisubizo by'ikizamini bihari. Banza ukore ikizamini!</p>";
            return;
        }

        container.innerHTML = "";
        reviewData.forEach((item, index) => {
            const box = document.createElement("div");
            box.className = "review-box";
            
            let imageHtml = "";
            if (item.image && item.image !== 'None') {
                let imgSource = item.image.startsWith('http') ? item.image : `https://res.cloudinary.com/du7r7iqwf/image/upload/${item.image}`;
                imageHtml = `<img src="${imgSource}" class="review-img" alt="Question Image">`;
            }

            box.innerHTML = `
                <p><strong>Ikibazo cya ${index + 1}:</strong> ${item.question}</p>
                ${imageHtml}
                <ul>
                    <li>1: ${item.answer1}</li>
                    <li>2: ${item.answer2}</li>
                    ${item.answer3 ? `<li>3: ${item.answer3}</li>` : ''}
                    ${item.answer4 ? `<li>4: ${item.answer4}</li>` : ''}
                </ul>
                <p class="correct-ans">Igisubizo cy'ukuri: Option ${item.correct}</p>
            `;
            container.appendChild(box);
        });
    });
</script>

</body>
</html>
