<form action="index.html" method="POST">
<div style="background-color: #e2f0ff; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
    <h3 style="margin: 0; color: #0056b3;">
        📊 Umubare w'ibibazo byose biri muri sisitemu: 
        <span id="total-questions-count" style="font-size: 24px; font-weight: bold; color: #000;">0</span>
    </h3>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Hano JavaScript iri gushaka ibintu byose bifite class yitwa 'question-item' cyangwa 'question-block'
        // Changwa niba ukoresha Table, ushobora gushyiramo ibisebe byose bya Table (rows)
        // Kuri iyi nshuro, reba niba ibibazo byawe bishya bifite aho bihuriye nka class:
        const questions = document.querySelectorAll('.question-block, .question-item, tr.question-row');
        
        // Niba nta class ziriho, niba ibibazo biza bimeze nka <h3>, twabara ama <h3> yose:
        // const questions = document.querySelectorAll('h3'); 

        const totalCount = questions.length;
        
        // Gushyira umubare mu gasanduku twakoze haruguru
        document.getElementById('total-questions-count').innerText = totalCount;
    });
</script>
