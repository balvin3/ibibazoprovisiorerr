<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Provisoire Rwanda</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1d24; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: #212529; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: auto; }
        h2 { color: #fff; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #adb5bd; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; background: #2b3035; border: 1px solid #373b3e; color: #fff; border-radius: 6px; box-sizing: border-box; }
        textarea { resize: vertical; height: 90px; }
        .btn-green { background: #198754; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-green:hover { background: #157347; }
        .btn-blue { background: #0d6efd; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        .btn-blue:hover { background: #0b5ed7; }
        .json-box { background: #111315; color: #00ffcc; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; margin-top: 20px; max-height: 250px; overflow-y: auto; border: 1px solid #373b3e; }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ Ongeramo Ikibazo Gishya</h2>
    
    <div class="form-group">
        <label>Andika umubiri w'ikibazo hano...</label>
        <textarea id="qText" placeholder="Andika ikibazo..."></textarea>
    </div>

    <div class="form-group">
        <label>Ifoto y'ikibazo (Andika izina ryayo ryiganze kuri Cloudinary cyangwa link):</label>
        <input type="text" id="qImage" placeholder="ikibazo1.jpg (cyangwa ubyireke niba nta yo)">
    </div>

    <div class="form-group">
        <label>Igisubizo A</label>
        <input type="text" id="ans1" placeholder="Igisubizo A">
    </div>

    <div class="form-group">
        <label>Igisubizo B</label>
        <input type="text" id="ans2" placeholder="Igisubizo B">
    </div>

    <div class="form-group">
        <label>Igisubizo C (Ona)</label>
        <input type="text" id="ans3" placeholder="Igisubizo C">
    </div>

    <div class="form-group">
        <label>Igisubizo D (Ona)</label>
        <input type="text" id="ans4" placeholder="Igisubizo D">
    </div>

    <div class="form-group">
        <label>Igisubizo cy'ukuri nikihe?</label>
        <select id="qCorrect">
            <option value="1">A</option>
            <option value="2">B</option>
            <option value="3">C</option>
            <option value="4">D</option>
        </select>
    </div>

    <button class="btn-green" onclick="addQuestion()">💾 Bika Ikibazo muri JSON</button>

    <h3 style="margin-top: 30px;">Ibibazo byakozwe (JSON Code):</h3>
    <div id="jsonOutput" class="json-box">[ ]</div>
    
    <button class="btn-blue" onclick="downloadJSON()">📥 Manura Fayili ya questions.json</button>
</div>

<script>
    let questionsList = [];

    function addQuestion() {
        let question = document.getElementById("qText").value.trim();
        let image = document.getElementById("qImage").value.trim();
        let answer1 = document.getElementById("ans1").value.trim();
        let answer2 = document.getElementById("ans2").value.trim();
        let answer3 = document.getElementById("ans3").value.trim();
        let answer4 = document.getElementById("ans4").value.trim();
        let correct = document.getElementById("qCorrect").value;

        if (!question || !answer1 || !answer2) {
            alert("Banza wuzuze byibuze ikibazo n'ibisubizo bibiri bya mbere!");
            return;
        }

        let newQ = {
            id: questionsList.length + 1,
            question: question,
            image: image,
            answer1: answer1,
            answer2: answer2,
            answer3: answer3,
            answer4: answer4,
            correct: correct
        };

        questionsList.push(newQ);
        document.getElementById("jsonOutput").innerText = JSON.stringify(questionsList, null, 4);
        
        // Gusukura iforose kugira ngo wandikemo ikindi
        document.getElementById("qText").value = "";
        document.getElementById("qImage").value = "";
        document.getElementById("ans1").value = "";
        document.getElementById("ans2").value = "";
        document.getElementById("ans3").value = "";
        document.getElementById("ans4").value = "";

        alert("Ikibazo cyongewe neza mu murongo wa JSON!");
    }

    function downloadJSON() {
        if (questionsList.length === 0) {
            alert("Nta bibazo birimo byo kumanura!");
            return;
        }

        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questionsList, null, 4));
        let downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "questions.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>

</body>
</html>
