<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Provisiore Rwanda</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f4f7fc;
        padding: 20px;
        color: #2d3748;
      }
      .admin-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .btn-add {
        background: #0066ff;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      .btn-add:hover {
        background: #0052cc;
      }
      .question-list {
        margin-top: 30px;
      }
      .question-item {
        background: #f8fafc;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #e2e8f0;
      }
      .question-item img {
        max-width: 80px;
        height: auto;
        border-radius: 6px;
        margin-right: 15px;
      }
      .question-content {
        display: flex;
        align-items: center;
      }
      .btn-delete {
        background: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <h2>🛠️ Admin Panel - Gucunga Ibibazo</h2>

      <!-- Umubare w'ibibazo -->
      <div
        style="
          background-color: #e2f0ff;
          border-left: 5px solid #007bff;
          padding: 15px;
          margin: 20px 0;
          border-radius: 4px;
        "
      >
        <h3 style="margin: 0; color: #0056b3">
          📊 Umubare w'ibibazo byose biri muri sisitemu:
          <span
            id="total-questions-count"
            style="font-size: 24px; font-weight: bold; color: #000"
            >0</span
          >
        </h3>
      </div>

      <!-- Form yo kongerera ikibazo gishya n'ifoto -->
      <form id="addQuestionForm" onsubmit="addNewQuestion(event)">
        <div class="form-group">
          <label>Andika Ikibazo:</label>
          <input
            type="text"
            id="qText"
            required
            placeholder="Andika ikibazo hano..."
          />
        </div>

        <div class="form-group">
          <label>Hitamo Ifoto (PNG, JPG):</label>
          <input type="file" id="qImageFile" accept="image/png, image/jpeg" />
        </div>

        <div class="form-group">
          <label>Igisubizo A:</label><input type="text" id="ans1" required />
        </div>
        <div class="form-group">
          <label>Igisubizo B:</label><input type="text" id="ans2" required />
        </div>
        <div class="form-group">
          <label>Igisubizo C:</label><input type="text" id="ans3" required />
        </div>
        <div class="form-group">
          <label>Igisubizo D:</label><input type="text" id="ans4" required />
        </div>

        <div class="form-group">
          <label>Igisubizo cy'ukuri:</label>
          <select id="correctAns">
            <option value="1">A</option>
            <option value="2">B</option>
            <option value="3">C</option>
            <option value="4">D</option>
          </select>
        </div>

        <button type="submit" class="btn-add">➕ Ongeraho Ikibazo</button>
      </form>

      <!-- Aho urutonde rw'ibibazo rwerekana -->
      <div class="question-list">
        <h3>📋 Urutonde rw'ibibazo bihari:</h3>
        <div id="questionsContainer"></div>
      </div>
    </div>

    <script>
      // 1. Gusoma ibibazo biri muri LocalStorage cyangwa gushyiramo ibifatizo (Default) niba nta bihari
      let storedQuestions = JSON.parse(
        localStorage.getItem("adminQuestions"),
      ) || [
        {
          question: "Ikimenyetso cy'umuhanda cyerekana iki?",
          image: "",
          answer1: "Kubuza guhagarara",
          answer2: "Gutanga inzira",
          answer3: "Ahanyurwa n'abanyamaguru",
          answer4: "Nta na kimwe cyayo",
          correct: "2",
        },
      ];

      document.addEventListener("DOMContentLoaded", function () {
        renderQuestions();
      });

      // 2. Gukora rendering y'ibibazo no kubara umubare wabyo
      function renderQuestions() {
        let container = document.getElementById("questionsContainer");
        container.innerHTML = "";

        storedQuestions.forEach((q, index) => {
          let item = document.createElement("div");
          item.className = "question-item";

          let imageTag = q.image
            ? `<img src="${q.image}" alt="Ifoto y'ikibazo">`
            : "";

          item.innerHTML = `
                <div class="question-content">
                    ${imageTag}
                    <div>
                        <strong>${index + 1}. ${q.question}</strong><br>
                        <small style="color: #64748b;">Nyacyo: Igisubizo cya ${q.correct}</small>
                    </div>
                </div>
                <button class="btn-delete" onclick="deleteQuestion(${index})">🗑️ Sisiba</button>
            `;
          container.appendChild(item);
        });

        // Vugurura umubare wose w'ibibazo
        document.getElementById("total-questions-count").innerText =
          storedQuestions.length;
      }

      // 3. Kongerera ikibazo gishya no guhindura ifoto ikaba Base64 yo kubika muri LocalStorage
      function addNewQuestion(event) {
        event.preventDefault();

        let imageInput = document.getElementById("qImageFile");
        let file = imageInput.files[0];

        if (file) {
          let reader = new FileReader();
          reader.onload = function (e) {
            saveQuestionData(e.target.result);
          };
          reader.readAsDataURL(file);
        } else {
          saveQuestionData("");
        }
      }

      function saveQuestionData(imageUrl) {
        let newQ = {
          question: document.getElementById("qText").value,
          image: imageUrl,
          answer1: document.getElementById("ans1").value,
          answer2: document.getElementById("ans2").value,
          answer3: document.getElementById("ans3").value,
          answer4: document.getElementById("ans4").value,
          correct: document.getElementById("correctAns").value,
        };

        storedQuestions.push(newQ);
        localStorage.setItem("adminQuestions", JSON.stringify(storedQuestions));
        localStorage.setItem("quizQuestions", JSON.stringify(storedQuestions));

        // Isukure form nyuma y'uko yiyanditse
        document.getElementById("addQuestionForm").reset();
        renderQuestions();
        alert("Ikibazo cyongerewe neza!");
      }

      // 4. Gusiba ikibazo
      function deleteQuestion(index) {
        if (confirm("Uremeye ko ushaka gusiba iki kibazo?")) {
          storedQuestions.splice(index, 1);
          localStorage.setItem(
            "adminQuestions",
            JSON.stringify(storedQuestions),
          );
          localStorage.setItem(
            "quizQuestions",
            JSON.stringify(storedQuestions),
          );
          renderQuestions();
        }
      }
    </script>

    <footer style="text-align: center; margin-top: 40px; color: #718096">
      <a href="about.html">About</a> | <a href="contact.html">Contact</a> |
      <a href="privacy.html">Privacy Policy</a> |
      <a href="terms.html">Terms & Conditions</a> |
      <a href="disclaimer.html">Disclaimer</a>
    </footer>
  </body>
</html>
