<h2>Ibisubizo by'ikizamini</h2>

<div id="review-container">
    <!-- Ahazanywa ibisubizo na JavaScript -->
    <p>Turi gushaka amakuru y'ibisubizo byawe...</p>
</div>

<a href="index.html" style="padding:10px; background:blue; color:white; text-decoration:none; display:inline-block; border-radius:6px; margin-top:20px;">Subira ahabanza</a>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById("review-container");
        let reviewData = JSON.parse(localStorage.getItem("provisoire_last_review")) || [];

        if (reviewData.length === 0) {
            container.innerHTML = "<p>Nta bisubizo by'ikizamini bihari. Banza ukore ikizamini!</p>";
            return;
        }

        container.innerHTML = "";
        reviewData.forEach((item, index) => {
            const box = document.createElement("div");
            box.className = "review-box";
            box.style.border = "1px solid #ccc";
            box.style.margin = "10px 0";
            box.style.padding = "15px";
            box.style.borderRadius = "8px";

            let imageHtml = "";
            if (item.image && item.image !== 'None') {
                let imgSource = item.image.startsWith('http') || item.image.startsWith('blob') ? item.image : `https://res.cloudinary.com/du7r7iqwf/image/upload/${item.image}`;
                imageHtml = `<img src="${imgSource}" style="max-width: 200px; display:block; margin: 10px 0;" alt="Question Image">`;
            }

            box.innerHTML = `
                <p><strong>Ikibazo cya ${index + 1}:</strong> ${item.question}</p>
                ${imageHtml}
                <p>Igisubizo cy'ukuri: <strong>${item.correct}</strong></p>
            `;
            container.appendChild(box);
        });
    });
</script>
