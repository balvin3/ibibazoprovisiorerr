<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provisiore Rwanda | Only Admin Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="https://fav.farm/🚗" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0066ff;
            --primary-hover: #0052cc;
            --bg-color: #f4f7fc;
            --text-dark: #2d3748;
            --text-light: #718096;
            --card-bg: #ffffff;
            --danger-bg: #fff5f5;
            --danger-text: #e53e3e;
            --danger-border: #fed7d7;
            --success-bg: #f0fff4;
            --success-text: #38a169;
            --success-border: #c6f6d5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        /* Alert Messages handled via JS */
        .alert {
            display: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert.danger {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
            display: block;
        }

        .alert.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            display: block;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="card">
        <h1>🚗 Provisiore Rwanda</h1>
        <h2>Admin Dashboard</h2>

        <!-- Dynamic Alert Message Container -->
        <div id="alert-box" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Izina ry'ukoresha (Username)</label>
                <input 
                    type="text" 
                    id="username"
                    name="username" 
                    placeholder="Andika username yawe" 
                    required>
            </div>

            <div class="form-group">
                <label for="password">Ijambo ry'ibanga (Password)</label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    placeholder="••••••••••••" 
                    required>
            </div>

            <button type="submit">Injira Mu Dashibodi 🔐</button>
        </form>

        <a href="#" id="back-link" class="back-link">← Subira ahabanza</a>
    </div>
</div>

<script>
    // Mock Admin Credentials (replace with real authentication logic if connecting to an API)
    const CORRECT_USERNAME = "admin";
    const CORRECT_PASSWORD = "password123";

    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    loginForm.addEventListener('submit', function(event) {
        // Prevent default form submission reload
        event.preventDefault();

        const enteredUsername = usernameInput.value.trim();
        const enteredPassword = passwordInput.value;

        // Clear previous alert states
        alertBox.className = "alert";
        alertBox.textContent = "";

        // Simple validation check
        if (enteredUsername === CORRECT_USERNAME && enteredPassword === CORRECT_PASSWORD) {
            alertBox.classList.add("success");
            alertBox.textContent = "✅ Byagenze neza! Winjiye muri dashibodi...";
            
            // Simulate redirection after successful login
            setTimeout(() => {
                alert("Welcome to the Admin Dashboard!");
                // window.location.href = "dashboard.html"; // Redirect link here
            }, 1000);
        } else {
            alertBox.classList.add("danger");
            alertBox.textContent = "⚠️ Izina cyangwa ijambo ry'ibanga si ryo. Ongera ugerageze.";
        }
    });
</script>

</body>
</html>
