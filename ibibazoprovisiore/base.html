<script>
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) {
                    if ((node.tagName === 'IFRAME' && node.src.includes('effectivecpmnetwork')) ||
                        (node.id && node.id.includes('socialbar')) ||
                        (node.className && typeof node.className === 'string' && node.className.includes('social'))) {
                        
                        node.style.setProperty('position', 'fixed', 'important');
                        node.style.setProperty('top', '50%', 'important');
                        node.style.setProperty('left', '50%', 'important');
                        node.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
                        node.style.setProperty('z-index', '999999', 'important');
                    }
                }
            });
        });
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

    setInterval(function() {
        const adElements = document.querySelectorAll("iframe[src*='effectivecpmnetwork'], div[id*='socialbar']");
        adElements.forEach(el => {
            el.style.setProperty('position', 'fixed', 'important');
            el.style.setProperty('top', '50%', 'important');
            el.style.setProperty('left', '50%', 'important');
            el.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
            el.style.setProperty('z-index', '999999', 'important');
        });
    }, 200);
</script>
