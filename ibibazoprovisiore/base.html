<script>
    // 1. Gushiraho Canonical Link na Dynamic Breadcrumb bikozwe na JavaScript
    document.addEventListener("DOMContentLoaded", function() {
        // Canonical link setup
        document.getElementById("canonicalLink").href = window.location.href;

        // Breadcrumb generator bitewe n'urupapuri ruriho ubu
        let path = window.location.pathname;
        let pageName = path.substring(path.lastIndexOf('/') + 1).replace('.html', '').replace(/-/g, ' ');

        if (pageName && pageName !== "index" && pageName !== "") {
            let breadcrumbList = document.getElementById("dynamicBreadcrumb");
            let capitalizedName = pageName.charAt(0).toUpperCase() + pageName.slice(1);
            
            let li = document.createElement("li");
            li.innerHTML = ` / <span class="active">${capitalizedName}</span>`;
            breadcrumbList.appendChild(li);
        }
    });
</script>
