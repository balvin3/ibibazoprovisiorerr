<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>Shyiraho Ifoto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Ongeraho Ikibazo n'Ifoto yacyo</h2>
    
    <form action="upload-quiz.html" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="question">Andika Ikibazo:</label>
            <input type="text" id="question" name="question" required placeholder="Urugero: Ni ikihe biribwa birimo vitamine C?">
        </div>
        
        <div class="form-group">
            <label for="image">Hitamo Ifoto (PNG, JPG):</label>
            <input type="file" id="image" name="image" accept="image/*" required>
        </div>
        
        <button type="submit">Bika kuri Cloudinary & DB</button>
    </form>

</body>
</html>
