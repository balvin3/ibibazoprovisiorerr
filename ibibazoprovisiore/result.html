<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikizamini Kirangiye | Provisoire Rwanda</title>
    <meta name="description" content="Reba amanota yawe ya Provisoire Rwanda. Witoze ibizamini by'uruhushya rwo gutwara ku buntu.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="https://fav.farm/🚗" />
    <link rel="stylesheet" href="./style.css">

    <!-- Script z'amamenyekamaza (Ad Scripts) -->
    <script src="https://pl30600128.effectivecpmnetwork.com/00/35/04/00350429f691455db5156209d1c06794.js"></script>
    <script src="https://quge5.com/88/tag.min.js" data-zone="265417" async data-cfasync="false"></script>

    <style>
        :root {
            --primary: #0066ff;
            --success: #198754;
            --danger: #dc3545;
            --bg: #f4f7fc;
            --card: #ffffff;
            --text: #2d3748;
            --muted: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
        }

        .card {
            background: var(--card);
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 55px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .feedback {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .pass { color: var(--success); }
        .fail { color: var(--danger); }

        .btn {
            display: block;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #edf2f7;
            color: var(--text);
        }

        .btn-primary:hover { background: #0052cc; }
        .btn-secondary:hover { background: #e2e8f0; }

        .whatsapp {
            margin-top: 20px;
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--muted);
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            margin: 0 5px;
        }

        footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Uduce tw'ibisubizo byagaragajwe */
        .review-section {
            text-align: left;
            margin-top: 30px;
            border-top: 2px solid #edf2f7;
            padding-top: 20px;
        }

        .review-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>🎉 Ikizamini Kirangiye</h1>
        <p>Reba amanota wagize:</p>

        <!-- Amanota azajya yinjira hano -->
        <div class="score" id="scoreDisplay">
            0 / 20
        </div>

        <div class="feedback" id="feedbackDisplay">
            Utegereje amanota...
        </div>

        <!-- Utubuto (Buttons) -->
        <a href="./quiz.html" class="btn btn-primary">🔄 Subiramo Ikizamini</a>
        <a href="./index.html" class="btn btn-secondary">🏠 Subira Ahabanza</a>

        <!-- WhatsApp SHARE -->
        <a class="whatsapp"
           href="https://wa.me/?text=Ese watsinze Provisoire? Jya kwitoreza ku rubuga rwa Provisoire Rwanda."
           target="_blank">
            📱 Tumira inshuti kuri WhatsApp
        </a>

        <!-- Aho ibisubizo byose n'ibyo wibeshyeho bizajya -->
        <div id="reviewContainer" class="review-section">
            <h3 style="margin-bottom: 15px; color: #334155; text-align: center;">Ibisubizo byose n'uko wabyitwayemo:</h3>
        </div>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Fata amanota na total muri localStorage (Ushyireho umutekano w'uko niba nta bihari bifata 0)
        let score = parseInt(localStorage.getItem('quiz_score'));
        let total = parseInt(localStorage.getItem('quiz_total'));

        // Niba zitabonetse cyangwa ari NaN, shyiraho default (nka 20 cyangwa 30 bitewe n'ibibazo byawe)
        if (isNaN(score)) score = 0;
        if (isNaN(total) || total === 0) total = 20;

        // 2. Shyira amanota mu mwanya wayo neza cyane
        const scoreDisplay = document.getElementById('scoreDisplay');
        if (scoreDisplay) {
            scoreDisplay.innerText = `${score} / ${total}`;
        }

        // 3. Kubara niba yatsinze (Ubusanzwe muri Provisoire bisaba 60% cyangwa kurenza)
        const feedbackDisplay = document.getElementById('feedbackDisplay');
        let passingMark = Math.ceil(total * 0.6); // 60% yo gutsinda

        if (feedbackDisplay) {
            if (score >= passingMark) {
                feedbackDisplay.className = "feedback pass";
                feedbackDisplay.innerHTML = "🎉 Watsinze neza cyane! Uratandukanye!";
            } else {
                feedbackDisplay.className = "feedback fail";
                feedbackDisplay.innerHTML = "❌ Ntibyakunze ku nshuro ya mbere. Ongera witoze uzatsinda!";
            }
        }

        // 4. Kurura no kwerekana review data y'ibibazo byose wakoze
        let reviewData = [];
        try {
            reviewData = JSON.parse(localStorage.getItem('current_quiz_questions')) || [];
        } catch (e) {
            reviewData = [];
        }

        const reviewContainer = document.getElementById('reviewContainer');

        if (reviewData.length > 0 && reviewContainer) {
            let htmlContent = `<h3 style="margin-bottom: 15px; color: #334155; text-align: center;">Ibisubizo byose n'uko wabyitwayemo:</h3>`;
            
            reviewData.forEach((item, index) => {
                let isCorrect = item.isCorrect;
                let statusColor = isCorrect ? '#198754' : '#dc3545';
                let statusText = isCorrect ? 'Nibyo (Neza) ✅' : 'Si byo ❌';

                let qNum = item.questionNumber || (index + 1);
                let qText = item.questionText || "Ikibazo cy'amategeko y'umuhanda";
                let userAns = item.userAnswer ? item.userAnswer : 'Nta gisubizo watanze';
                let correctAns = item.correctAnswer ? item.correctAnswer : 'Nta cyatanzwe';

                htmlContent += `
                    <div class="review-item">
                        <p style="font-weight: 600; color: #1e293b; margin-bottom: 8px;">Ikibazo ${qNum}: ${qText}</p>
                        <p style="margin: 4px 0; color: #475569;">Igisubizo cyawe: <strong>${userAns}</strong></p>
                        <p style="margin: 4px 0; color: #475569;">Igisubizo nyacyo: <strong style="color: #0066ff;">${correctAns}</strong></p>
                        <p style="margin-top: 6px; font-weight: 600; color: ${statusColor};">Uko wabyitwaye: ${statusText}</p>
                    </div>
                `;
            });
            
            reviewContainer.innerHTML = htmlContent;
        } else if (reviewContainer) {
            reviewContainer.innerHTML = `<p style="text-align: center; color: #718096; font-size: 14px;">Nta bisubizo by'ubushakashatsi byabitswe. Kora ikizamini bushya kugira ngo ubirebe hano.</p>`;
        }
    });
</script>

</footer>

</body>
</html>
