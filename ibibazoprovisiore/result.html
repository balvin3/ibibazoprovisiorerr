<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikizamini Kirangiye | Provisoire Rwanda</title>
    <meta name="description" content="Reba amanota yawe ya Provisoire Rwanda. Witoze ibizamini by'uruhushya rwo gutwara ku buntu.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="https://fav.farm/🚗" />
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #0066ff;
            --success: #198754;
            --danger: #dc3545;
            --bg: #f4f7fc;
            --card: #ffffff;
            --text: #2d3748;
            --muted: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
        }

        .card {
            background: var(--card);
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 55px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .feedback {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .pass { color: var(--success); }
        .fail { color: var(--danger); }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #edf2f7;
            color: var(--text);
        }

        .btn-primary:hover { background: #0052cc; }
        .btn-secondary:hover { background: #e2e8f0; }

        .whatsapp {
            margin-top: 20px;
            display: inline-block;
            background: #25d366;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--muted);
        }

        .footer-links {
            margin-bottom: 10px;
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            margin: 0 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>🎉 Ikizamini Kirangiye</h1>
        <p>Reba amanota wagize:</p>

        <!-- Aha ni ho JavaScript izasoma amanota -->
        <div class="score" id="scoreDisplay">
            0 / 0
        </div>

        <div class="feedback" id="feedbackDisplay">
            Tegereza gato...
        </div>

        <a href="quiz.html" class="btn btn-primary">🔄 Subiramo Ikizamini</a>
        <a href="index.html" class="btn btn-secondary">🏠 Subira Ahabanza</a>

        <a class="whatsapp"
           id="whatsappShare"
           href="https://wa.me/?text=Ese%20watsinze%20Provisoire?%20Jya%20kuri%20https://ibibazoprovisoire.com"
           target="_blank">
            📱 Tumira inshuti kuri WhatsApp
        </a>
    </div>
</div>

<script>
    // Gusoma amanota yabitse muri LocalStorage na JavaScript
    window.addEventListener("DOMContentLoaded", function() {
        let score = parseInt(localStorage.getItem("quizScore")) || 0;
        let total = parseInt(localStorage.getItem("quizTotal")) || 20;

        // Kwerekana amanota kuri paji
        document.getElementById("scoreDisplay").innerText = `${score} / ${total}`;

        // Gutanga ubutumwa bushingiye ku manota (Mu Rwanda gutsinda ni 12/20 cyangwa birenga)
        let feedbackEl = document.getElementById("feedbackDisplay");
        if (score >= 12) {
            feedbackEl.innerText = "🎉 Watsinze neza! Uratandukanye cyane!";
            feedbackEl.className = "feedback pass";
        } else {
            feedbackEl.innerText = "❌ Ntibyakunze. Ongera witoze ube better!";
            feedbackEl.className = "feedback fail";
        }

        // Guhindura ubutumwa bwa WhatsApp bugaragaza n'amanota wagize
        let whatsappBtn = document.getElementById("whatsappShare");
        whatsappBtn.href = `https://wa.me/?text=Naherutse%20gukora%20Provisoire%20matsinda%20${score}/${total}.%20Nawe%20witoze%20hano:%20https://ibibazoprovisoire.com`;
    });
</script>

<footer>
    <div class="footer-links">
        <a href="about.html">About</a> • 
        <a href="contact.html">Contact</a> • 
        <a href="privacy.html">Privacy</a> • 
        <a href="terms.html">Terms</a> • 
        <a href="disclaimer.html">Disclaimer</a> • 
        <a href="faq.html">FAQ</a>
    </div>
    <p>© 2026 Provisoire Rwanda | All Rights Reserved.</p>
</footer>

</body>
</html>
