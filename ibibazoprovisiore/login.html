<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Provisoire Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7fc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 8px; color: #2d3748; }
        p { color: #718096; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #0066ff; }
        button { width: 100%; padding: 12px; background: #0066ff; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0052cc; }
        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; }
        .alert.error { background: #f8d7da; color: #dc3545; display: block; }
        .alert.success { background: #d1e7dd; color: #198754; display: block; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔐 Injira mu Buyobozi</h2>
    <p>Andika umwirondoro wawe kugira ngo winjire muri Dashboard.</p>

    <div id="alert-box" class="alert"></div>

    <form id="login-form">
        <div class="form-group">
            <label>Izina ry'ubuyobozi (Username)</label>
            <input type="text" id="username" placeholder="Urugero: admin" required>
        </div>
        <div class="form-group">
            <label>Ijambo ry'ibanga (Password)</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Injira Mu Dashibodi 🚀</button>
    </form>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const alertBox = document.getElementById('alert-box');

        // Amakuru y'ibanze y'umuyobozi
        if (user === "admin" && pass === "password123") {
            alertBox.className = "alert success";
            alertBox.textContent = "✅ Byagenze neza! Winjiye muri dashibodi...";
            localStorage.setItem("isLoggedIn", "true");
            setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
        } else {
            alertBox.className = "alert error";
            alertBox.textContent = "⚠️ Izina cyangwa ijambo ry'ibanga si byo!";
        }
    });
</script>

</body>
</html>
